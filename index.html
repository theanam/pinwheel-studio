<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinwheel Studio</title>
<meta name="description" content="An open-source desktop-publishing studio that runs entirely in the browser. No account, no server, no uploads.">
<link rel="canonical" href="https://pinwheelstudio.org/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pinwheel Studio">
<meta property="og:title" content="Pinwheel Studio">
<meta property="og:description" content="Free, open-source design studio in your browser. Social posts, thumbnails, decks and print — your files never leave your machine.">
<meta property="og:url" content="https://pinwheelstudio.org/">
<meta property="og:image" content="https://pinwheelstudio.org/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F2EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1917">

<!-- Spec §12: only the pinned CDN hosts, Google Fonts and the model mirror.
     'wasm-unsafe-eval' is what onnxruntime-web needs to compile the background-removal
     model; it permits WebAssembly only, not eval(). Hugging Face redirects the model
     download to a regional CDN (us.aws.cdn.hf.co and friends), hence the wildcards. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' data: https://fonts.gstatic.com;
  img-src 'self' data: blob:;
  connect-src 'self' data: blob: https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com https://huggingface.co https://*.huggingface.co https://*.hf.co;
  worker-src 'self' blob:;
  object-src 'none';
  base-uri 'self';
  form-action 'none'">

<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">

</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
